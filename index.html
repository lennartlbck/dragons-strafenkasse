<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragons Kasse">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:16px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dragons Kasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: iOS-artige Kassen-App – kompakte App-Bar mit Kassenstand, großer Seitentitel, gruppierte Listen, Tab-Leiste mit Safe-Area, Bottom-Sheets mit Griff */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f6f7fb; --seg:#e6e9f1;
  --ink:#0b1630; --ink-2:#34405c; --muted:#5b6782; --line:#e2e6ef; --line-strong:#c8cfdd;
  --brand:#1747c4; --brand-ink:#0f2f86; --brand-soft:#e8eefc; --on-brand:#ffffff;
  --owe:#b4400a; --owe-soft:#fdeee5; --good:#157a3f; --good-soft:#e3f4e9; --danger:#b42318; --danger-soft:#fdecea;
  --paypal:#0b5fbf; --on-good:#ffffff;
  --shadow:0 12px 40px rgba(15,35,90,.18);
  --r:16px; --r-sm:12px; --tabbar-h:56px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --surface:#141c2d; --surface-2:#1a2337; --seg:#1f2940;
  --ink:#eef2fa; --ink-2:#c5cde0; --muted:#9aa6bf; --line:#253049; --line-strong:#3a4762;
  --brand:#7299ff; --brand-ink:#0d1f52; --brand-soft:#1a2a52; --on-brand:#ffffff;
  --owe:#ffa36b; --owe-soft:#3a2416; --good:#55d394; --good-soft:#123222; --danger:#ff8379; --danger-soft:#3b1815;
  --paypal:#1f63c6; --on-good:#06281a; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#141c2d; --surface-2:#1a2337; --seg:#1f2940;
  --ink:#eef2fa; --ink-2:#c5cde0; --muted:#9aa6bf; --line:#253049; --line-strong:#3a4762;
  --brand:#7299ff; --brand-ink:#0d1f52; --brand-soft:#1a2a52; --on-brand:#ffffff;
  --owe:#ffa36b; --owe-soft:#3a2416; --good:#55d394; --good-soft:#123222; --danger:#ff8379; --danger-soft:#3b1815;
  --paypal:#1f63c6; --on-good:#06281a; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}

/* App-Bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand-ink);color:#fff}
.appbar-in{display:flex;align-items:center;gap:12px;min-height:58px}
.crest{width:38px;height:38px;flex:none;border-radius:11px;background:#fff;color:var(--brand-ink);display:grid;place-items:center;font:700 14px/1 var(--f-display);letter-spacing:.04em}
.ab-t{flex:1;min-width:0}
.ab-t small{display:block;font-size:12px;line-height:1.2;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-t b{display:block;font:700 21px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-k{flex:none;text-align:right;background:rgba(255,255,255,.13);border-radius:12px;padding:5px 10px}
.ab-k span{display:block;font-size:11px;line-height:1.1;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.ab-k b{display:block;font:700 21px/1.1 var(--f-display)}

main{padding-top:4px;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 28px)}
.ltitle{font:700 34px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:14px 0 14px;text-wrap:balance}
.section-h{font:600 13px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 4px 8px}
.section-h:first-child{margin-top:4px}
.whohead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 8px}
.whohead .section-h{margin:0 4px}
.whohead .chipbtn{min-height:44px;padding:0 14px;flex:none}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:calc(100% - 8px);min-height:44px;border:0;background:transparent;text-align:left;cursor:pointer;margin:14px 4px 0;padding:0}
.mhead .chev{margin:0;color:var(--muted);transition:transform .2s}
.mhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rows[hidden]{display:none}
.note{color:var(--muted);font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);font-size:15px}
.banner{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;margin-bottom:12px}
.info{background:var(--brand-soft);color:var(--ink-2);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:-4px 0 12px}
.me b{color:var(--ink)}

/* Suche */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;color:var(--muted)}
.search:focus-within{outline:3px solid var(--brand);outline-offset:1px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;min-height:46px;color:var(--ink);outline:none}

/* Gruppierte Listen */
.fines,.people,.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fines>*+*,.people>*+*,.rows>*+*{border-top:1px solid var(--line)}
.fine,.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;padding:12px 14px;min-height:58px;transition:background .15s}
.fine:active,.person:active,.row.tap:active{background:var(--surface-2)}
.finerow{display:flex;align-items:stretch;background:var(--surface)}
.finerow .fine{flex:1;min-width:0;padding-left:4px}
.star{flex:none;width:52px;border:0;background:transparent;color:var(--line-strong);display:grid;place-items:center;transition:color .15s,transform .15s var(--ease)}
.star .ico{width:24px;height:24px}
.star:active{transform:scale(.85)}
.star[aria-pressed="true"]{color:var(--owe)}
.fine .t,.person .n{flex:1;min-width:0}
.fine .t b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.fine .t i{font-style:normal;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{flex:none;max-width:44%;text-align:right;font-weight:600;font-size:14px;line-height:1.3;color:var(--brand)}
.chev{color:var(--line-strong);width:18px;height:18px;flex:none;margin-right:-4px}
.free{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;min-height:52px;border-radius:var(--r);border:1.5px dashed var(--brand);background:transparent;color:var(--brand);font-weight:600;font-size:15px}
.free:active{background:var(--brand-soft)}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.one{grid-template-columns:1fr}
.stats.one .stat{text-align:left;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:34px}
.kfl{min-width:0}
.kfnow{display:flex;align-items:center;gap:10px;min-width:0;margin-left:auto}
.kfnow .av{width:36px;height:36px;font-size:13px;flex:none}
.kfnow small{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kfnow strong{display:block;font:600 16px/1.2 var(--f-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat>span{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:700 clamp(17px,5.4vw,22px)/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{position:relative}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:background .15s}
button.stat:active{background:var(--surface-2)}
.stat .chev{position:absolute;right:8px;bottom:14px;width:18px;height:18px}
.stat.open b{color:var(--owe)} .stat.paid b{color:var(--good)} .stat.kf b{color:var(--danger)}

/* Personen */
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font:700 16px var(--f-display);color:var(--brand);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.person .n b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .n i{display:block;font-style:normal;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .n .tag{margin-top:4px}
.amt{flex:none;font:700 20px/1 var(--f-display);text-align:right}
.amt.pos{color:var(--owe)} .amt.neg{color:var(--good)} .amt.zero{color:var(--muted);font-weight:600}

/* Einträge */
.row{display:flex;align-items:center;gap:8px;background:var(--surface);padding:8px 6px 8px 8px;min-height:62px}
.row.tap{width:100%;text-align:left;border:0;cursor:pointer;padding-left:12px}
.row .av{width:40px;height:40px;font-size:14px}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m i{display:block;font-style:normal;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.row .r{flex:none;text-align:right}
.row .r strong{font:700 18px/1.1 var(--f-display);white-space:nowrap}
.row.paid .r strong{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.tick{flex:none;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%}
.tick span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s,color .15s}
.tick span svg{width:16px;height:16px}
.tick[aria-pressed="true"] span{background:var(--good);border-color:var(--good);color:#fff}
.iconbtn{flex:none;min-width:44px;height:44px;border:0;background:transparent;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.iconbtn:active{background:var(--surface-2)}
.iconbtn:disabled{opacity:.35}
.iconbtn.warn{color:var(--danger);background:var(--danger-soft);padding:0 10px;font-size:13px;font-weight:700}
.iconbtn.round{border-radius:50%;background:var(--surface);border:1px solid var(--line)}

.k{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mgroup{margin-top:12px}
.mgroup>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.mgroup>summary::-webkit-details-marker{display:none}
.mgroup[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.mgroup .mg-t{flex:1;min-width:0}
.mgroup .mg-t b{display:block;font:700 19px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.mgroup .mg-t small{display:block;color:var(--muted);font-size:13.5px}
.mgroup>summary .chev{transition:transform .2s}
.mgroup[open]>summary .chev{transform:rotate(90deg)}
.mgroup>.rows{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.mcard h2{margin:0 0 8px;font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.mc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc-row b{display:block;font:700 clamp(19px,6vw,24px)/1.2 var(--f-display);white-space:nowrap}
.mc-row b.in{color:var(--good)} .mc-row b.out{color:var(--danger)}
.payall{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;margin-bottom:12px;padding:10px 14px;text-align:left;background:var(--good-soft);border:1.5px solid var(--good);border-radius:var(--r);color:var(--ink);transition:transform .12s var(--ease)}
.payall:active{transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rpt{display:none}
@media print{
  body.printing>*:not(#printRoot){display:none!important}
  body.printing{background:#fff!important;color:#000!important}
  body.printing #printRoot,body.printing .rpt{display:block!important}
  .rpt{font:12px/1.4 system-ui,-apple-system,sans-serif;color:#000;padding:0}
  .rpt h1{font-size:22px;margin:0} .rpt .sub{margin:2px 0 14px;font-size:14px;color:#444}
  .rpt h2{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #999;padding-bottom:3px}
  .rpt table{width:100%;border-collapse:collapse;margin:0 0 4px} .rpt th{text-align:left;font-size:11px;color:#444;padding:3px 6px;border-bottom:1px solid #bbb}
  .rpt td{padding:3px 6px;border-bottom:1px solid #e3e3e3} .rpt td.r,.rpt th:not(:first-child){text-align:right}
  .rpt tr.t td{font-weight:700;border-top:1.5px solid #000;border-bottom:0}
  .rpt table.kp td{border:1px solid #bbb;padding:8px;text-align:left} .rpt table.kp span{display:block;font-size:10px;color:#555;text-transform:uppercase} .rpt table.kp b{font-size:16px}
  .rpt .note{margin:6px 0;color:#333} .rpt .foot{margin-top:18px;font-size:10px;color:#666}
  .rpt tr{break-inside:avoid}
  @page{margin:14mm}
}
.stcard{margin:14px 0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stcard h3{margin:0 0 2px;font:700 18px/1.2 var(--f-display)} .stcard .note{margin:0 0 10px}
.stbars{display:grid;gap:10px;margin-top:10px}
.strow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"md nm vl" ". bar bar";align-items:center;column-gap:8px;row-gap:4px}
.strow .md{grid-area:md;font-size:20px;text-align:center} .strow .rk{font-size:14px;font-weight:700;color:var(--muted)}
.strow .nm{grid-area:nm;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .vl{grid-area:vl;font-weight:700} .strow .bar{grid-area:bar;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.strow .bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.strow.mine .nm{color:var(--brand)}
.sub-h{margin:18px 2px 8px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.two.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kres{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kres b{font-size:1.1rem}
.linkbtn{display:block;margin:16px auto 4px;background:none;border:0;color:var(--brand);font:inherit;font-weight:600;text-decoration:underline;min-height:44px}
.payall.kasse{background:var(--surface);border-color:var(--line-strong)} .payall.kasse .pa-ic{background:var(--brand);color:#fff}
.stat.backup{display:grid;gap:12px;padding:14px} .stat.backup p{margin:0;font-size:.92rem;color:var(--muted)} .stat.backup p b{display:inline;font:inherit;font-weight:700;white-space:normal;color:var(--ink)}
.stat.backup.warn{border-color:var(--owe)}
.credbox{margin-bottom:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.credbox div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;font-size:.92rem;color:var(--muted)}
.credbox div b{color:var(--ink);font-weight:600}
.credbox .sum{margin-top:4px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}
.credbox .sum b{font-size:1.05rem;font-weight:700} .credbox .sum b.pos{color:var(--owe)} .credbox .sum b.neg{color:var(--good)}
.payall .pa-ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--good);color:var(--on-good);display:grid;place-items:center}
.payall .pa-ic svg{width:20px;height:20px}
.payall .pa-t{flex:1;min-width:0}
.payall b{display:block;font:700 19px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.payall small{display:block;font-size:13.5px;color:var(--ink-2)}
.payall.wait{background:var(--owe-soft);border-color:var(--owe)}
.payall.wait .pa-ic{background:var(--owe);color:var(--bg)}
.payall .chev{flex:none;margin-right:0}
.paybox.wait{border-color:var(--owe)}
.mrow.cf .acts .mini{min-height:44px}
.payall.done{background:var(--surface-2);border-color:var(--line);opacity:.7}
.payall.done .pa-ic{background:var(--line-strong)}
.row.dq{padding:8px 10px}
.row.dq .stepper{flex:none;gap:6px}
.row.dq .stepper button{width:44px;height:44px}
.dqin{width:56px;min-height:44px;padding:0 4px;text-align:center;font:700 20px var(--f-display);border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.dqin:focus{outline:3px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.sortbar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.sortbar .seg{flex:1}
.sortbar .seg button{min-height:44px;font-size:14px;padding:0 6px}
.teampick .teamav{background:var(--brand,#1d3fc4);color:#fff;font-weight:800;font-family:'Barlow Condensed',sans-serif;font-size:20px}
.teampick b{white-space:nowrap}
.kfrow{align-items:center}
.grip{display:grid;place-items:center;width:32px;min-height:44px;margin-left:-6px;color:var(--muted);touch-action:none;cursor:grab;flex:none;border-radius:8px}
.grip svg{width:20px;height:20px}
.pos{font:700 15px var(--f-display);color:var(--muted);min-width:16px;text-align:center;flex:none}
.kfrow.dragging{background:var(--surface);box-shadow:0 8px 24px rgba(10,20,50,.22);position:relative;z-index:2;border-radius:12px}
.drg{font-size:.9em;white-space:nowrap}
.m.editable{cursor:pointer}
.edtag{display:inline-block;margin-top:2px;font-size:11px;color:var(--muted);font-weight:600}
.hlog{font-size:13px;color:var(--ink-2);margin-top:2px}
.rthumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--seg);flex:none}
.rbig{width:100%;border-radius:12px;display:block;background:var(--seg);min-height:160px;object-fit:contain;max-height:60vh}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.rcbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.rcbtn small{display:block;color:var(--muted);font-size:13px}
/* Mitglieder */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;background:var(--surface);padding:12px 14px}
.mrow .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .m i{display:block;font-style:normal;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mrow .acts select{flex:1 1 140px;min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-size:16px;font-weight:600}
.mrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mrow .acts .mini{min-height:44px;flex:1 1 auto}
/* Tags / Chips */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.2;padding:3px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.tag.kf{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.owe{background:var(--owe-soft);color:var(--owe)}
.chipbtn{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:4px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chipbtn::after{content:"";position:absolute;inset:-6px -2px}
.chipbtn.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chipbtn svg{width:14px;height:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-decoration:none;color:var(--ink);transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.paypal{background:var(--paypal);border-color:var(--paypal);color:#fff;width:100%}
.btn:disabled{opacity:.45;transform:none}
.btn.block{width:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar .btn{flex:1 1 auto}
.mini{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600}
.mini.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.mini.warn{color:var(--danger);border-color:var(--danger)}

/* Segment */
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink-2);transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,50,.14)}
.seg.full{width:100%}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.tabs{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px)}}
.tabs .wrap{display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;min-width:0;min-height:var(--tabbar-h);border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--brand)}

/* Monat / KPIs */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.monthbar h2{margin:0;flex:1;text-align:center;font:700 24px/1.1 var(--f-display);text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font:700 24px/1.2 var(--f-display);white-space:nowrap}
.kpi.in b{color:var(--good)}
.kpi.out b{color:var(--danger)}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.net{background:var(--brand);border-color:var(--brand);color:#fff}
/* Menü, Döner, Fußball */
.ltrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ltrow .ltitle{min-width:0}
.menubtn{color:var(--ink)}
.menubtn .ico{width:22px;height:22px}
.menulist{display:grid;gap:8px}
.menuitem{display:flex;align-items:center;gap:14px;width:100%;height:76px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;color:var(--ink);transition:background .1s}
.menuitem:active{background:var(--surface-2)}
.menuitem .mi-ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:24px}
.menuitem .mi-t{flex:1;min-width:0}
.menuitem b{display:block;font-size:17px}
.menuitem small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menuitem .ico{color:var(--muted)}
.row .m i.wrap{white-space:normal;overflow:visible;color:var(--ink-2)}
.score{display:flex;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.score .sc-t{flex:1;text-align:center;min-width:0}
.score .sc-t span{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.score .sc-t b{display:block;font:700 44px/1.1 var(--f-display);color:var(--ink-2)}
.score .sc-t.win b,.score .sc-t.win span{color:var(--brand)}
.score .sc-x{align-self:center;font:700 32px var(--f-display);color:var(--muted)}
.stepper output{min-width:44px;text-align:center;font:700 24px var(--f-display)}
.stepper.sm{gap:6px;flex:none}
.stepper.sm button{width:40px;height:40px}
.stepper.sm output{min-width:28px;font-size:20px}
.fbaddbtn{width:100%;margin-top:8px}
.pushk{cursor:pointer}
.tapw{cursor:pointer}
.cal-d.tapw:active,.cal-kw.tapw:active{background:var(--surface-2)}
.gbnext{display:grid;gap:8px}
.gbn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--brand);color:#fff}
.gbn .av{width:52px;height:52px;border:2px solid rgba(255,255,255,.6)}
.gbn .m{flex:1;min-width:0}
.gbn small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.gbn b{display:block;font:700 22px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbn i{display:block;font-style:normal;font-size:14px;opacity:.9}
.gbic{font-size:32px}
.gbrow .gbd{flex:none;width:56px}
.gbrow .gbd b{font:700 18px var(--f-display)}
.gbrow.now{background:var(--brand-soft)}
.two .btn{align-self:end}
.btn.paypal.off{opacity:.45;pointer-events:none}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calnav b{font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px}
.cal-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-kw{font-size:10.5px;font-weight:600;color:var(--muted);display:grid;place-items:center;white-space:nowrap}
.cal-kw.has{color:var(--brand)}
.cal-d{height:34px;display:grid;place-items:center;font-size:14px;font-weight:600;border-radius:8px}
.cal-d.out{color:var(--muted);opacity:.45;font-weight:500}
.cal-d.has{background:var(--brand-soft)}
.cal-d.has.now{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.cal-d.today span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff}
.cal-host{grid-column:2/-1;display:flex;align-items:center;gap:8px;background:var(--brand-soft);border-radius:10px;padding:5px 8px;margin:0 0 6px;min-width:0}
.cal-host.now{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.cal-host .av{width:30px;height:30px;font-size:12px}
.cal-host div{min-width:0}
.cal-host b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-host i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .2s;cursor:pointer;margin:0 4px}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--good)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pick:disabled{opacity:.45}
.gamerow .m b .gw{color:var(--brand)}
.gamerow .m i{margin-top:2px}
.gamerow .gt{display:inline-block;min-width:34px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fields+.score{margin-top:14px}
.fbnew{width:100%;margin-top:10px}
.series{display:flex;flex-wrap:wrap;gap:6px}
.sch{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.sch{cursor:pointer;transition:transform .1s}
.sch:active{transform:scale(.95)}
.sch b{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sch small{font:700 15px var(--f-display);color:var(--ink-2)}
.sch.jung{background:var(--brand-soft);border-color:transparent}
.sch.jung b{color:var(--brand)}
.sch.alt{background:var(--owe-soft);border-color:transparent}
.sch.alt b{color:var(--owe)}
.streak{margin:10px 4px 0;font-size:15px;color:var(--ink-2)}
.goalrow{align-items:flex-start}
.goalrow .m b{margin-top:10px}
.gsteps{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.gsteps small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kpi.net span{color:#fff;opacity:.85}

/* Übersicht: Karten auf dem Handy, Tabelle ab Tablet */
.pcards{display:grid;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pc-h{display:flex;align-items:center;gap:10px}
.pc-h .av{width:36px;height:36px;font-size:13px}
.pc-h .nm{flex:1;min-width:0}
.pc-h .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-h .nm small{display:block;color:var(--muted);font-size:13px}
.pc-sum{flex:none;text-align:right;font:700 20px/1.1 var(--f-display)}
.pc-sum.owe{color:var(--owe)} .pc-sum.cred{color:var(--good)}
.pc-sum small{display:block;font:600 12px var(--f-body);color:var(--muted)}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc-chip{font-size:13px;background:var(--surface-2);border-radius:8px;padding:4px 8px;color:var(--muted)}
.pc-chip b{color:var(--ink);font-weight:600}
.pc-chip.gut b{color:var(--good)}
.pcard.total{background:var(--brand-soft);border-color:transparent}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
@media (max-width:759px){.tablewrap{display:none}}
@media (min-width:760px){.pcards{display:none}}
table.maka{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:14px}
.maka th,.maka td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.maka thead th{position:sticky;top:0;background:var(--brand-ink);color:#fff;font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.maka th:first-child,.maka td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.maka thead th:first-child{background:var(--brand-ink);z-index:2}
.maka td.zero{color:var(--muted);opacity:.6}
.maka td.sum{font-weight:700}
.maka td.gut{color:var(--good)} .maka td.owe{color:var(--owe);font-weight:700} .maka td.cred{color:var(--good);font-weight:700}
.maka td.pname{font-weight:600} .maka td.pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.maka tfoot td{background:var(--brand-soft);font-weight:700;border-bottom:0}
.legend-note{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Kostenliste */
.costs{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cost{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.cost .lbl{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost .bar{grid-column:1/-1;grid-row:2;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cost .bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.cost .val{font-weight:600;text-align:right;white-space:nowrap}
.cost .val small{color:var(--muted);font-weight:400;margin-left:6px}
.cost.total{border-top:1px solid var(--line);padding-top:12px}

/* Zahltag / Kassenwart */
.zahltag{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--paypal);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.zahltag>svg{grid-row:span 2;width:28px;height:28px;opacity:.9}
.zahltag b{font-weight:700;font-size:16px}
.zahltag span{font-size:14px;opacity:.92}
.zahltag .btn{grid-column:1/-1;margin-top:10px;background:#fff;color:var(--paypal);border-color:#fff}
.kwcard{display:grid;gap:10px;background:var(--surface);border:1px dashed var(--brand);border-radius:var(--r);padding:14px;margin-bottom:12px}
.kwcard b{display:block;font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.kwcard span{font-size:14px;color:var(--muted)}

/* Bezahlen */
.paybox{display:grid;gap:10px;background:var(--surface);border:2px solid var(--paypal);border-radius:var(--r);padding:14px;margin-bottom:14px}
.paybox.done{border-color:var(--good)}
.paybox p{margin:0}
.pay-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pay-h span{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pay-h b{font:700 30px/1 var(--f-display);color:var(--owe)}
.pp-addr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;min-height:44px}
.pp-addr span{min-width:0;overflow-wrap:anywhere}
details.bank{border-top:1px solid var(--line);padding-top:4px}
details.bank summary{cursor:pointer;font-weight:600;color:var(--brand);min-height:44px;display:flex;align-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,12,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.scrim{animation:fade .2s ease-out}.sheet{animation:up .3s var(--ease)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{background:rgba(5,12,30,0)}}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding-top:8px;padding-bottom:12px;flex:none}
.sheet-h .t{flex:1;min-width:0}
.sheet-h h2{margin:0;font:700 26px/1.08 var(--f-display);text-wrap:balance}
.sheet-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:18px;flex:1}
.sheet-f{flex:none;border-top:1px solid var(--line);background:var(--surface);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-f .btn{width:100%}
.sheet-f .split{display:flex;gap:8px}
.sheet-f .split .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding:0 12px;overflow:hidden;text-overflow:ellipsis}
.sheet-f .split .btn:first-child:not(:only-child){flex:0 0 auto;width:auto;min-width:96px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88vh}.sheet-f{border-radius:0 0 20px 20px}}

/* Spieler-Auswahl */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:340px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
.pick{position:relative;border:2px solid transparent;background:var(--surface);border-radius:var(--r-sm);padding:10px 4px 8px;display:grid;justify-items:center;gap:3px;min-width:0;transition:background .15s,border-color .15s}
.pick .av{width:48px;height:48px}
.pick b{font-size:13.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick small{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-2px}
.pick .no{position:absolute;top:4px;left:7px;font:700 13px var(--f-display);color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pick .ok{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:none;place-items:center}
.pick .ok svg{width:13px;height:13px}
.pick[aria-pressed="true"] .ok{display:grid}

/* Formulare */
.fields{display:grid;gap:14px;margin-top:8px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:16px}
.field select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;flex:none;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.stepper input{text-align:center;font:700 22px var(--f-display)}
.check{display:flex;gap:12px;align-items:center;min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-weight:500}
.check input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.hint{background:var(--brand-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:var(--ink-2)}
.hint+.section-h{margin-top:18px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);font-size:15px}
.toast button{border:0;background:transparent;color:var(--owe-soft);font-weight:700;min-height:36px}

/* Anmeldung */
.auth{max-width:420px;margin:28px auto;display:grid;gap:14px}
.auth h2{margin:0;font:700 34px/1.05 var(--f-display);text-transform:uppercase}
.auth p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dDE=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const CAT_ORDER=['Beiträge & Getränke','Pünktlichkeit & Anwesenheit','Spiel & Training','Handy & Verhalten','Kleidung & Eigentum','Ämter','Sonderstrafen','Kasse'];

const S={players:[],fines:[],entries:[],bills:[],got:{p:0,f:0,e:0,b:0},db:null,uid:null,canWrite:null,canEdit:false,
  settings:{},mOpen:{},bClosed:{},receipts:[],rcUrls:{},favs:[],ksort:'nr',smode:'saison',links:[],prof:{},zahltags:[],doener:[],fussball:[],geburt:{},wash:{},gb:{},gbDone:{},members:[],me:null,tab:'erfassen',q:'',status:'loading',sheet:null,stale:false,month:today().slice(0,7),kview:'personen'};
const COLS=[['beitrag','Monatsbeitrag'],['strafen','Strafen'],['fussball','Fußball'],['bier','Bier'],['sonder','Sonderausgaben']];
const COL_BY_FINE={f01:'beitrag',f02:'bier',f03:'bier',f26:'fussball'};
const colOf=e=>e.col||COL_BY_FINE[e.fineId]||(e.billId?'sonder':'strafen');
const isCost=b=>!b.kind||b.kind==='ausgabe';
const BILL_CATS=['Duschdas','Bier','Pfand','Musikbox','Teamevent','Tickets Kerb','Auslagen Oktoberfest','Fußball','Würfel','Plakat & Sticker','Spieltag Verpflegung','Babyöl','Mega KBF','Auslagen letzte Saison','Therme','Spende','Pizza Spieltag','Zelser Spieltag'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const monthName=m=>m==='saison'?'Saison 26/27':MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const inPeriod=(d,m)=>m==='saison'||String(d||'').slice(0,7)===m;
const shortName=p=>{if(!p)return'?';const [f,...r]=p.name.split(' ');const dup=S.players.filter(x=>x.name.split(' ')[0]===f).length>1;return dup&&r.length?f+' '+r[r.length-1][0]+'.':f};
try{const t=localStorage.getItem('tab');if(t)S.tab=t==='konten'?'uebersicht':t;const k=localStorage.getItem('ksort');if(['nr','high','low'].includes(k))S.ksort=k}catch(e){}

const ICONS={
 erfassen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 konten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14c1.6.7 2.6 2.4 3 5"/></svg>',
 uebersicht:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M9.5 9.5V20"/></svg>',
 rechnungen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
 verlauf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 grip:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
 camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>',
 chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 euro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5M4 10h9M4 14h9"/></svg>',
 logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M10 16l-4-4 4-4M6 12h10"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9L3.5 9.8l5.9-.8z"/></svg>',
 starFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9L3.5 9.8l5.9-.8z"/></svg>',
 verwalten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'};

const I=k=>ICONS[k].replace('<svg','<svg class="ico" aria-hidden="true" focusable="false"');
const TITLES={erfassen:'Eintragen',uebersicht:'Übersicht',rechnungen:'Rechnungen',verwalten:'Verwalten'};
/* ---------- Ableitungen ---------- */
const pById=id=>S.players.find(p=>p.id===id)||TEAM_ENT.find(p=>p.id===id);
function sortedPlayers(all){
  const list=S.players.filter(p=>all||p.active!==false);
  return list.sort((a,b)=>{const sa=a.role==='Spieler'?0:1,sb=b.role==='Spieler'?0:1;if(sa!==sb)return sa-sb;
    if(sa===0)return (a.number??999)-(b.number??999);return (a.order??50)-(b.order??50)||a.name.localeCompare(b.name)});
}
function balance(pid){let open=0,paid=0,kf=0,credit=0,rep=0;for(const e of S.entries){if(e.playerId!==pid)continue;
  if(e.paid)paid+=e.amount||0;else{open+=e.amount||0;if(e.reported)rep++} if(e.kabinenfest&&!e.kfDone)kf++;}
  credit=r2(credMap()[pid]||0);open=r2(open);return{open,paid,kf,credit,rep,net:r2(open-credit)}}
const r2=x=>Math.round(x*100)/100;
// Guthaben aus ausgelegten Rechnungen/Gutschriften: was davon noch nicht erstattet oder mit Strafen verrechnet ist
// ACHTUNG: spiegelt credit_left()/consume_credit() in supabase/schema.sql – Regeländerungen immer an beiden Stellen machen
const credLeft=b=>r2((b.amount||0)-(b.credited||0));
let _cm={src:null,m:{}};
function credMap(){if(_cm.src!==S.bills){const m={};for(const b of S.bills){if(b.kind==='einzahlung'||!b.paidBy||b.refunded)continue;const l=credLeft(b);if(l>0)m[b.paidBy]=(m[b.paidBy]||0)+l}_cm={src:S.bills,m}}return _cm.m}
// Bezahlt Einträge über die Datenbank und verrechnet dabei vorhandenes Guthaben (auch Teilbeträge).
// Automatisch verrechnet wird sonst nur beim Start des Zahltags (apply_credit_all in schema.sql).
async function payEntries(pid,ids,via){if(!ids.length)return{n:0,used:0};
  const {data,error}=await S.sb.rpc('pay_entries',{pid,ids,via});if(error)throw error;
  try{await S.db.refresh('entries','bills')}catch(e){}
  return data||{n:0,used:0}}
const sumAmt=es=>r2(es.reduce((a,e)=>a+(e.amount||0),0));
const netTxt=n=>n>0?eur(n):n<0?'+ '+eur(-n):eur(0);
// ---------- Backup ----------
const BACKUP_TABLES=['players','fines','entries','bills','settings','zahltag','fees','receipts','members','kasse_intern','fussball','doener','geburt','trikotwash','geburtstage'];
const daysSince=iso=>iso?Math.floor((Date.now()-Date.parse(iso))/DAY):null;
async function makeBackup(){
  const out={app:'Dragons Kasse',format:1,exportedAt:new Date().toISOString(),tables:{}},counts={};
  for(const t of BACKUP_TABLES){const all=[];
    for(let from=0;;from+=1000){const {data,error}=await S.sb.from(t).select(t==='members'?'*':'id,data,updated_at').order(t==='members'?'user_id':'id').range(from,from+999);
      if(error)throw error;all.push(...(data||[]));if(!data||data.length<1000)break}
    out.tables[t]=all;counts[t]=all.length}
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`dragons-kasse-backup-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  // die Datei ist schon gespeichert: scheitert nur der Zeitstempel, ist das kein fehlgeschlagenes Backup
  try{await S.db.doc('kasse_intern/backup').set({lastAt:out.exportedAt,by:pById(myPid())?.name||S.email||null,counts})}catch(e){counts.noStamp=true}
  return counts}
// Protokoll für Änderungen, die den Kassenstand verschieben (bezahlte Einträge gelöscht/geöffnet, Rechnung gelöscht).
// Liegt in kasse_intern (nur Kassenwart/Admin) und erscheint im Kassenstand unter „Änderungen seit dem letzten Abgleich“.
async function logChange(text,amount){
  try{const it={at:new Date().toISOString(),by:pById(myPid())?.name||S.email||null,text,amount:amount==null?null:r2(amount)};
    await S.db.doc('kasse_intern/protokoll').set({items:[it,...((S.klog||{}).items||[])].slice(0,200)})}catch(e){}
}
// ---------- Kassenstand ----------
// Soll = Startbestand + Zahlungen der Spieler (ohne den mit Guthaben verrechneten Teil) + Sondereinzahlungen
//        − Ausgaben aus der Kasse − Erstattungen an Spieler (jeweils ab dem Startdatum)
function kasseSoll(){
  const st=(S.kstand||{}).start;if(!st||!st.date)return null;const d0=st.date,day=x=>String(x||'').slice(0,10);
  let pay=0,ein=0,aus=0,erst=0;
  for(const e of S.entries)if(e.paid&&day(e.paidAt||e.date)>=d0)pay+=(e.amount||0)-(e.creditUsed||0);
  for(const b of S.bills){
    if(b.kind==='einzahlung'){if(day(b.date)>=d0)ein+=b.amount||0;continue}
    if(isCost(b)&&!b.paidBy&&day(b.date)>=d0)aus+=b.amount||0;
    if(b.paidBy&&b.refunded&&!b.verrechnet&&day(b.refundedAt||b.date)>=d0)erst+=credLeft(b)}
  pay=r2(pay);ein=r2(ein);aus=r2(aus);erst=r2(erst);
  return{start:r2(st.amount||0),date:d0,pay,ein,aus,erst,soll:r2((st.amount||0)+pay+ein-aus-erst)}}
const kasseIst=()=>r2(['kk','kp','kb'].reduce((a,id)=>a+num($('#'+id)?.value||0),0));
function kasseDiffHtml(ist,soll){const d=r2(ist-soll);
  return d===0?`<span class="tag ok">passt genau</span>`:`<span class="tag ${d>0?'ok':'owe'}">${d>0?'+ ':'− '}${eur(Math.abs(d))} ${d>0?'mehr als erwartet':'fehlen'}</span>`}
function totals(){let open=0,paid=0,kf=0;for(const e of S.entries){if(e.paid)paid+=e.amount||0;else open+=e.amount||0;if(e.kabinenfest&&!e.kfDone)kf++}return{open,paid,kf}}
function priceLabel(f){const p=[];if(f.base)p.push(eur(f.base));if(f.per)p.push((f.base?'+ ':'')+eur(f.per)+' / '+(f.unit||'Stück'));
  if(f.kabinenfest)p.push((p.length?'+ ':'')+'Kabinenfest');if(f.wuerfeln)p.push((p.length?'+ ':'')+'Würfeln');return p.join(' ')||'Betrag frei'}
function avatar(p,cls=''){if(!p)return `<span class="av ${cls}">?</span>`;
  if(p.img)return `<span class="av ${cls}"><img src="${esc(p.img)}" alt="" loading="lazy"></span>`;
  const ini=p.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('');return `<span class="av ${cls}">${esc(ini)}</span>`}
const ROLES=[['member','Spieler'],['kassenwart','Kassenwart'],['admin','Admin'],['deckenzaehler','Deckenzähler']];
const roleName=r=>(ROLES.find(x=>x[0]===r)||[0,r])[1];
const pLabel=p=>p?(p.role==='Spieler'&&p.number!=null?'#'+p.number+' · ':'')+(p.role&&p.role!=='Spieler'?p.role:'Spieler'):'';

/* ---------- Rendering ---------- */
function renderTabs(){
  const tabs=[['erfassen','Eintragen'],['uebersicht','Übersicht'],['rechnungen','Rechnungen']];
  if(S.canEdit||isKW())tabs.push(['verwalten','Verwalten']);
  if(!tabs.some(t=>t[0]===S.tab))S.tab='erfassen';
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-k="${k}" ${S.tab===k?'aria-current="page"':''}>${ICONS[k]}${l}</button>`).join('');
}
function statusBanner(){
  if(S.status==='nodb')return `<div class="banner">Die Kasse ist gerade nicht erreichbar. Prüfe deine Internetverbindung und lade die Seite neu.</div>`;
  if(S.stale)return `<div class="banner">Die Daten sind gerade nicht erreichbar. Was du siehst, ist eventuell nicht aktuell.</div>`;
  if(S.onlyDecke)return `<div class="info">Als Deckenzähler trägst du „Fußball an der Decke“ ein. Alles andere macht der Kassenwart.</div>`;
  if(S.canWrite===false)return `<div class="info">Du siehst die Kasse und kannst bezahlen. Strafen und Rechnungen trägt der Kassenwart ein. Fotos von Rechnungen kannst du unter „Rechnungen“ hochladen.</div>`;
  return '';
}
function render(){
  if(S.status==='auth')return;
  renderTabs();
  const v=$('#view');
  if(S.tab==='erfassen'){
    if(!$('#finelist')){v.innerHTML=`<h1 class="ltitle">Eintragen</h1><div id="bn"></div><label class="search">${I('search')}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Strafe suchen" value="${esc(S.q)}" aria-label="Strafe suchen"></label><div id="finelist"></div>`}
    $('#bn').innerHTML=statusBanner();
    $('#finelist').innerHTML=fineList();
  } else{const sx=v.querySelector('.tablewrap')?.scrollLeft||0;
    const title=`<h1 class="ltitle">${TITLES[S.tab]}</h1>`;
    const html=(S.tab==='uebersicht'?`<div class="ltrow">${title}<button class="iconbtn round menubtn" data-act="openMenu" aria-label="Menü: Döner, Fußball, Kabinenfest, Trikots und Benachrichtigungen" aria-haspopup="dialog">${I('menu')}</button></div>`:title)+statusBanner()+(S.tab==='uebersicht'?zahltagBanner():'')+(S.tab==='uebersicht'?uebersichtAll():S.tab==='rechnungen'?rechnungen():verwalten());
    // nur neu aufbauen, wenn sich wirklich etwas geändert hat (sonst ruckelt die Seite bei jeder Server-Meldung)
    if(v.__html!==html||!v.__node||v.firstElementChild!==v.__node){v.innerHTML=html;v.__html=html;v.__node=v.firstElementChild;const tw=v.querySelector('.tablewrap');if(tw)tw.scrollLeft=sx}}
  if(S.sheet)renderSheet(true);
  checkPenalties();hydrateImgs();gbKfCheck();
}
function loadingOr(html,what){
  if(S.status==='loading')return `<div class="empty">Lade ${what} …</div>`;
  return html;
}
function fineList(){
  const q=S.q.trim().toLowerCase();
  const fines=S.fines.filter(f=>(!S.onlyDecke||f.id===DECKE_FINE)&&(!q||(f.title+' '+(f.hint||'')+' '+(f.cat||'')).toLowerCase().includes(q)));
  if(S.status==='loading')return `<div class="empty" style="margin-top:12px">Lade Strafenkatalog …</div>`;
  if(!S.fines.length)return `<div class="empty" style="margin-top:12px">Noch kein Strafenkatalog hinterlegt.${S.canEdit?' Lege unter „Verwalten“ die erste Strafe an.':''}</div>`;
  const groups={};for(const f of fines)(groups[f.cat||'Sonstiges']??=[]).push(f);
  const cats=Object.keys(groups).sort((a,b)=>{const ia=CAT_ORDER.indexOf(a),ib=CAT_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  let h='';
  if(!q&&!S.onlyDecke)h+=`<button class="free" data-act="free">${I('plus')} Freier Betrag (Sonstiges, Würfeln …)</button>`;
  if(!cats.length)h+=`<div class="empty" style="margin-top:12px">Keine Strafe passt zu „${esc(S.q)}“.</div>`;
  const byOrder=(a,b)=>(a.order??0)-(b.order??0);
  const row=f=>{const fav=S.favs.includes(f.id);return `<div class="finerow"><button class="star" data-act="fav" data-id="${esc(f.id)}" aria-pressed="${fav}" aria-label="${esc(f.title)} ${fav?'aus den Favoriten entfernen':'zu den Favoriten hinzufügen'}">${I(fav?'starFill':'star')}</button><button class="fine" data-act="fine" data-id="${esc(f.id)}"><span class="t"><b>${esc(f.title)}</b>${f.hint?`<i>${esc(f.hint)}</i>`:''}</span><span class="price">${esc(priceLabel(f))}</span>${I('chevR').replace('class="ico"','class="ico chev"')}</button></div>`};
  const favs=!q?S.favs.map(id=>fines.find(f=>f.id===id)).filter(Boolean):[];
  if(favs.length)h+=`<h2 class="section-h">Favoriten</h2><div class="fines">`+favs.map(row).join('')+`</div>`;
  for(const c of cats){
    h+=`<h2 class="section-h">${esc(c)}</h2><div class="fines">`+groups[c].sort(byOrder).map(row).join('')+`</div>`;
  }
  return h;
}
/* ---------- Bezahlen per PayPal ---------- */
function ppTarget(raw){let v=String(raw===undefined?S.settings.paypal||'':raw||'').trim();if(!v)return null;
  if(v.includes('@')&&!/paypal\.me/i.test(v))return{type:'mail',v};
  v=v.replace(/^https?:\/\//i,'').replace(/^(www\.)?paypal\.me\//i,'').split(/[/?#]/)[0];return v?{type:'me',v}:null}
function paypalUrl(amount,name,target,item){const t=target===undefined?ppTarget():target;if(!t)return null;const a=(Math.round(amount*100)/100).toFixed(2);
  if(t.type==='me')return `https://www.paypal.me/${encodeURIComponent(t.v)}/${a}EUR`;
  return `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(t.v)}&amount=${a}&currency_code=EUR&no_shipping=1&item_name=${encodeURIComponent(item||'Mannschaftskasse Dragons – '+name)}`}
const ibanOk=v=>{if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v))return false;const r=(v.slice(4)+v.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+ +ch)%97;return m===1};
const fmtIban=v=>String(v).replace(/\s/g,'').replace(/(.{4})/g,'$1 ').trim();
const purpose=p=>'Mannschaftskasse Dragons '+p.name;
const toPay=b=>Math.max(0,Math.round((b.open-b.credit)*100)/100);

const zAll=()=>[...S.zahltags].filter(z=>z.endsAt).sort((a,b)=>String(b.startedAt).localeCompare(String(a.startedAt)));
function zReview(z){
  const end=Date.parse(z.endsAt),ids=new Set(z.entryIds||[]),rows=[];let due=0,paid=0,open=0,late=0,fees=0,feesOpen=0;
  const lateFees=S.entries.filter(e=>e.auto&&/^verzug-/.test(e.id)&&e.id.split('-')[1]===z.runId);
  for(const pid of Object.keys(z.due||{})){
    const es=S.entries.filter(e=>ids.has(e.id)&&e.playerId===pid),dueAmt=r2(z.due[pid]||0);
    // noch offen = offene Zahltag-Einträge, aber höchstens das, was nach Abzug des Guthabens wirklich zu zahlen ist
    const bal=balance(pid);
    const rest=r2(Math.min(es.filter(e=>!e.paid).reduce((a,e)=>a+(e.amount||0),0),Math.max(0,bal.net)));
    const lateEs=es.filter(e=>e.paid&&Date.parse(e.reportedAt||e.paidAt||0)>end);
    const fe=lateFees.find(e=>e.playerId===pid);
    const st=rest>0?'open':(lateEs.length||(fe&&fe.paid))?'late':'ok';
    rows.push({pid,p:pById(pid),due:dueAmt,rest:r2(rest+(fe&&!fe.paid?fe.amount||0:0)),st,fee:fe||null,net:bal.net});
    due+=dueAmt;if(st==='open'){open+=rest}else if(st==='late')late+=dueAmt;else paid+=dueAmt;
    if(fe){fees+=fe.amount||0;if(!fe.paid)feesOpen+=fe.amount||0}
  }
  const erlassen=Math.max(0,(z.penaltiesCount||0)-lateFees.length);
  rows.sort((a,b)=>({open:0,late:1,ok:2}[a.st]-{open:0,late:1,ok:2}[b.st])||b.rest-a.rest||(a.p?.number??999)-(b.p?.number??999));
  return{rows,due:r2(due),open:r2(open),late:r2(late),paid:r2(paid),fees:r2(fees),feesOpen:r2(feesOpen),erlassen,
         n:{open:rows.filter(r=>r.st==='open').length,late:rows.filter(r=>r.st==='late').length,ok:rows.filter(r=>r.st==='ok').length},over:Date.now()>=end}
}

function leftTxt(ms){if(ms<=0)return 'abgelaufen';const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.ceil(ms%36e5/6e4);
  return d?`noch ${d} ${d===1?'Tag':'Tage'}${h?' '+h+' Std.':''}`:h?`noch ${h} Std.`:`noch ${m} Min.`}
const dtDE=iso=>{const d=new Date(iso);return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'};
function payBox(p,b){
  if(!zOpen()||myPid()!==p.id)return ''; // bezahlen kann jeder nur für sich selbst
  const z=zt(),amt=toPay(b),url=paypalUrl(amt,p.name),t=ppTarget();
  const mine=myPid()===p.id,canMark=mine||isKW()||S.canEdit;
  const myOpen=S.entries.filter(e=>e.playerId===p.id&&!e.paid),toReport=myOpen.filter(e=>!e.reported),pending=myOpen.filter(e=>e.reported);
  const repSum=toReport.reduce((a,e)=>a+(e.amount||0),0),direct=isKW();
  const head=`<div class="pay-h"><span>Zahltag · bis ${esc(dtDE(z.endsAt))} · ${esc(leftTxt(Date.parse(z.endsAt)-Date.now()))}</span>${amt>0?`<b class="num">${eur(amt)}</b>`:''}</div>`;
  if(amt<=0)return `<div class="paybox done">${head}<span>${esc(mine?'Du musst':p.name.split(' ')[0]+' muss')} gerade nichts zahlen${b.credit>b.open?` – Guthaben ${eur(b.credit-b.open)}`:''}.</span></div>`;
  if(!direct&&pending.length&&!toReport.length)return `<div class="paybox wait">${head}<p><b>Zahlung gemeldet</b></p><p class="note">Der Kassenwart prüft, ob das Geld angekommen ist, und bestätigt es dann. Bis dahin steht der Betrag noch als offen da.</p><button class="btn" data-act="unreport" data-id="${esc(p.id)}">Meldung zurücknehmen</button></div>`;
  return `<div class="paybox">${head}
    ${b.credit?`<p class="note">Offen ${eur(b.open)} − Guthaben ${eur(b.credit)}</p>`:''}${S.settings.payNote?`<p>${esc(S.settings.payNote)}</p>`:''}
    ${url?`<a class="btn paypal" href="${esc(url)}" target="_blank" rel="noopener" data-act="ppOpened" data-id="${esc(p.id)}">Mit PayPal bezahlen · ${eur(amt)}</a>
    <div class="pp-addr"><span>An: <b>${esc(t.v)}</b></span><button class="mini" data-act="copyPP">Kopieren</button></div>`:''}
    ${S.settings.iban?`<details class="bank" ${url?'':'open'}><summary>Lieber per Überweisung</summary>
      <div class="pp-addr"><span>IBAN: <b class="num">${esc(fmtIban(S.settings.iban))}</b></span><button class="mini" data-act="copyTxt" data-v="${esc(S.settings.iban.replace(/\s/g,''))}">Kopieren</button></div>
      ${S.settings.owner?`<div class="pp-addr"><span>Empfänger: <b>${esc(S.settings.owner)}</b></span></div>`:''}
      <div class="pp-addr"><span>Betrag: <b class="num">${eur(amt)}</b></span><button class="mini" data-act="copyTxt" data-v="${amt.toFixed(2).replace('.',',')}">Kopieren</button></div>
      <div class="pp-addr"><span>Verwendungszweck: <b>${esc(purpose(p))}</b></span><button class="mini" data-act="copyTxt" data-v="${esc(purpose(p))}">Kopieren</button></div></details>`:''}
    ${canMark?`<button class="btn good ${S.ppOpened===p.id?'pulse':''}" data-act="selfPaid" data-id="${esc(p.id)}">${S.confirmPaid===p.id?(direct?`Ja, ${eur(b.open)} als bezahlt markieren`:`Ja, ${eur(repSum)} als bezahlt melden`):'Ich habe bezahlt'}</button>`
      :''}
    ${direct?'':`<p class="note">Nach deiner Meldung bestätigt der Kassenwart die Zahlung, sobald das Geld angekommen ist.</p>`}
    <p class="note">Wer bis ${esc(dtDE(z.endsAt))} nicht bezahlt hat, bekommt automatisch ${eur(LATE_FEE)} Strafe (Zahlungsverzug).</p></div>`;
}

/* ---------- Übersicht (wie die MaKa-Tabelle) ---------- */
function periods(){
  const set=new Set([today().slice(0,7)]);
  for(const e of S.entries)if(e.date)set.add(e.date.slice(0,7));
  for(const b of S.bills)if(b.date)set.add(b.date.slice(0,7));
  return [...set].sort();
}
// Zahlen für eine Monats- oder Saisonübersicht (Übersicht, PDF und Excel nutzen dieselbe Rechnung)
function reportData(m){
  const rows=[];const tot={beitrag:0,strafen:0,fussball:0,bier:0,sonder:0,aus:0,gut:0,sum:0};
  const ent=S.entries.filter(e=>inPeriod(e.date,m)),bills=S.bills.filter(b=>inPeriod(b.date,m));
  for(const p of sortedPlayers(true)){
    const r={p,beitrag:0,strafen:0,fussball:0,bier:0,sonder:0,gut:0,open:0,n:0};
    for(const e of ent)if(e.playerId===p.id){r[colOf(e)]+=e.amount||0;r.n++;if(!e.paid)r.open+=e.amount||0}
    for(const b of bills)if(b.kind!=='einzahlung'&&b.paidBy===p.id)r.gut+=b.amount||0;
    r.aus=r.beitrag+r.strafen+r.fussball+r.bier+r.sonder;r.sum=r.aus-r.gut;
    if(p.role!=='Spieler'&&!r.aus&&!r.gut)continue;
    if(p.active===false&&!r.aus&&!r.gut)continue;
    rows.push(r);for(const k in tot)tot[k]+=r[k]||0;
  }
  const einnahmen=tot.aus,ausgaben=bills.filter(isCost).reduce((s,b)=>s+(b.amount||0),0),
        sonderein=bills.filter(b=>b.kind==='einzahlung').reduce((s,b)=>s+(b.amount||0),0),netto=einnahmen-ausgaben+sonderein;
  return{rows,tot,ent,bills,einnahmen,ausgaben,sonderein,netto};
}
function uebersicht(){
  if(S.status==='loading')return {top:'',bottom:''};
  const ps=periods(),m=S.month;const idx=m==='saison'?ps.length:ps.indexOf(m);
  let h=`<div class="monthbar"><button class="iconbtn round" data-act="month" data-d="-1" aria-label="Vorheriger Monat" ${idx<=0?'disabled':''}>${I('chevL')}</button><h2>${esc(monthName(m))}</h2><button class="iconbtn round" data-act="month" data-d="1" aria-label="Nächster Monat" ${m==='saison'?'disabled':''}>${I('chevR')}</button></div>`;
  const {rows,tot,ent,bills,einnahmen,ausgaben,sonderein,netto}=reportData(m);
  h+=`<div class="kpis"><div class="kpi in"><span>Einnahmen</span><b class="num">${eur(einnahmen)}</b></div><div class="kpi out"><span>Ausgaben</span><b class="num">${eur(ausgaben)}</b></div><div class="kpi"><span>Sondereinzahlungen</span><b class="num">${eur(sonderein)}</b></div><div class="kpi net"><span>Netto</span><b class="num">${eur(netto)}</b></div></div>`;
  const top=h;h='';
  // Kostenliste
  const byCat={};for(const b of bills)if(isCost(b))byCat[b.cat||'Sonstiges']=(byCat[b.cat||'Sonstiges']||0)+(b.amount||0);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...cats.map(x=>x[1]));
  h+=`<h2 class="section-h">Kostenliste · Ausgaben des Teams</h2>`;
  h+=cats.length?`<div class="costs">`+cats.map(([k,v])=>`<div class="cost" title="${esc(k)}: ${eur(v)} (${Math.round(v/ausgaben*100)} %)"><span class="lbl">${esc(k)}</span><span class="bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="val">${eur(v)}<small>${Math.round(v/ausgaben*100)} %</small></span></div>`).join('')+
    `<div class="cost total"><b>Gesamt</b><b class="val">${eur(ausgaben)}</b></div></div>`
    :`<div class="empty">Keine Rechnungen in diesem Zeitraum. Unter „Rechnungen“ kannst du Ausgaben wie Bier, Duschdas oder Tickets eintragen.</div>`;
  h+=`<div class="toolbar" style="margin-top:16px"><button class="btn block" data-act="copyMonth">Übersicht für die Gruppe kopieren</button></div>`;
  S._lastOverview={rows,tot,einnahmen,ausgaben,sonderein,netto,cats};
  return {top,bottom:h};
}

async function hydrateImgs(){
  const els=[...document.querySelectorAll('img[data-path]:not([src])')];if(!els.length||!S.sb)return;
  if(S.rcFailAt&&Date.now()-S.rcFailAt<30000&&els.every(e=>!(S.rcUrls[e.dataset.path]&&S.rcUrls[e.dataset.path].exp>Date.now())))return;
  const need=[...new Set(els.map(e=>e.dataset.path))].filter(x=>!(S.rcUrls[x]&&S.rcUrls[x].exp>Date.now()));
  if(need.length){try{const {data,error}=await S.sb.storage.from('belege').createSignedUrls(need,3600);if(error)throw error;S.rcFailAt=0;(data||[]).forEach(d=>{if(d.signedUrl)S.rcUrls[d.path]={u:d.signedUrl,exp:Date.now()+3500e3}})}catch(e){S.rcFailAt=Date.now()}}
  els.forEach(e=>{const c=S.rcUrls[e.dataset.path];if(c)e.src=c.u});
}
async function shrinkImage(file,max=1600){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(b)return b}catch(e){}
  return /^image\/(jpeg|png|webp)$/.test(file.type)&&file.size<=5*1024*1024?file:null;
}
function rcBack(s){const b=s&&s.back;if(b)openSheet(b);else closeSheet()}
async function saveReceipt(){
  const s=S.sheet;if(!s||!s.blob||s.busy||!S.sb)return;s.busy=true;const btn=$('#rcsave');if(btn)btn.disabled=true;

  try{
    const up=await S.sb.storage.from('belege').upload(path,s.blob,{contentType:s.blob.type||'image/jpeg'});if(up.error)throw up.error;

    catch(e){try{await S.sb.storage.from('belege').remove([path])}catch(_){}throw e}
    closeSheet();toast('Beleg hochgeladen – der Kassenwart sieht ihn jetzt');
  }catch(e){s.busy=false;if(btn)btn.disabled=false;toast(errMsg(e))}
}
async function saveEntry(){
  const s=S.sheet,e=S.entries.find(x=>x.id===s.id);if(!e)return;
  const raw=$('#ea').value.trim();
  const n={playerId:$('#ep').value,title:$('#et').value.trim()||e.title,amount:Math.round(num(raw)*100)/100,date:$('#ed').value||e.date,note:$('#en').value.trim()};
  if(!raw||!isFinite(parseFloat(raw.replace(',','.')))||n.amount<0){toast('Bitte einen gültigen Betrag eingeben');return}
  const nm=id=>pById(id)?.name||'?',c=[];
  if(n.playerId!==e.playerId)c.push(`Person: ${nm(e.playerId)} → ${nm(n.playerId)}`);
  if(n.title!==e.title)c.push(`Bezeichnung: „${e.title}“ → „${n.title}“`);
  if(n.amount!==e.amount)c.push(`Betrag: ${eur(e.amount)} → ${eur(n.amount)}`);
  if(n.date!==e.date)c.push(`Datum: ${dDE(e.date)} → ${dDE(n.date)}`);
  if(n.note!==(e.note||''))c.push(`Notiz: „${e.note||''}“ → „${n.note}“`);
  if(!c.length){rcBack(s);return}
  const by=pById(myPid())?.name||S.email||'Unbekannt';
  const reset=e.reported&&!e.paid&&(n.playerId!==e.playerId||n.amount!==e.amount);
  if(reset)c.push('Zahlungsmeldung zurückgesetzt');
  await setEntry(e.id,{...n,...(reset?{reported:false,reportedAt:null,reportedBy:null}:{}),note:n.note||null,history:[...(e.history||[]),{at:new Date().toISOString(),by,c}]});
  toast('Eintrag geändert');rcBack(s);
}
function rechnungen(){
  if(S.status==='loading')return `<div class="empty">Lade Rechnungen …</div>`;
  let h=(S.canWrite!==false?`<div class="toolbar" style="margin-top:0"><button class="btn primary" data-act="editBill" data-k="ausgabe">${I('plus')}Rechnung</button><button class="btn" data-act="editBill" data-k="einzahlung">${I('plus')}Einzahlung</button></div>`:'')+receiptsBlock();
  if(!S.bills.length)return h+`<div class="empty">Noch keine Rechnungen. Trag hier Ausgaben fürs Team ein – z. B. Bier, Duschdas oder Kerb-Tickets. Wer ausgelegt hat, bekommt den Betrag als Gutschrift; auf Wunsch wird die Rechnung als Sonderausgabe auf Spieler umgelegt.</div>`;
  const list=[...S.bills].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt).localeCompare(String(a.createdAt)));
  let cur='';

const MONEY_COLS=['strafen','fussball','bier'];
const byVal=(a,b)=>b.v-a.v||(pById(a.id).number??999)-(pById(b.id).number??999);
// Wettbewerbs-Rang (Gleichstand teilt sich den Platz); mit n nur die ersten n Plätze
function rankTop(l,n){let rk=0,prev=null;l.forEach((x,i)=>{if(x.v!==prev){rk=i+1;prev=x.v}x.rk=rk});return n?l.filter(x=>x.rk<=n):l}
// Summe aus Strafen, Fußball und Bier je Spieler in einem Monat (ohne Teams)
function monthTotals(mon){const t={};for(const e of S.entries){const p=pById(e.playerId);if(!p||p.team||String(e.date||'').slice(0,7)!==mon||!MONEY_COLS.includes(colOf(e)))continue;t[e.playerId]=(t[e.playerId]||0)+(e.amount||0)}return t}
const topIds=t=>{const mx=Math.max(0,...Object.values(t));return mx>0?Object.keys(t).filter(i=>t[i]===mx):[]};
function statistik(){
  const mo=S.smode==='monat'?curMonth():'saison',me=myPid();
  const isP=e=>{const p=pById(e.playerId);return !!p&&!p.team};
  const ent=S.entries.filter(e=>inPeriod(e.date,mo)&&isP(e)&&(e.amount||0)>0);
  const per={};for(const e of ent){const c=colOf(e);if(!MONEY_COLS.includes(c))continue;const r=per[e.playerId]??={strafen:0,fussball:0,bier:0};r[c]+=e.amount||0}
  const rankBy=(get,n=5)=>rankTop(Object.entries(per).map(([id,r])=>({id,v:r2(get(r))})).filter(x=>x.v>0).sort(byVal),n);
  const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':`<span class="rk">${r}.</span>`;
  const bars=(list,fmt)=>{if(!list.length)return `<p class="note" style="margin:6px 4px">Noch keine Daten.</p>`;const mx=list[0].v;
    return `<div class="stbars">`+list.map(x=>{const p=pById(x.id);return `<div class="strow ${x.id===me?'mine':''}"><span class="md">${medal(x.rk)}</span><span class="nm">${esc(p.name)}${drg(x.id)}${x.id===me?' <span class="tag ok">du</span>':''}</span><span class="vl num">${fmt(x.v)}</span><span class="bar"><i style="width:${Math.max(4,x.v/mx*100)}%"></i></span></div>`}).join('')+`</div>`};
  const card=(t,sub,body)=>`<div class="stcard"><h3>${t}</h3>${sub?`<p class="note">${sub}</p>`:''}${body}</div>`;
  // Kabinenfeste
  const kf={};for(const e of S.entries)if(e.kabinenfest&&inPeriod(e.date,mo)&&isP(e))kf[e.playerId]=(kf[e.playerId]||0)+1;
  const kfl=rankTop(Object.entries(kf).map(([id,v])=>({id,v})).sort(byVal),5);
  // Drachen-Titel: wer hat in einem abgeschlossenen Monat am meisten gezahlt
  const titles={};if(mo==='saison')for(const m of periods().filter(m=>m<curMonth()))for(const id of topIds(monthTotals(m)))titles[id]=(titles[id]||0)+1;
  const tl=rankTop(Object.entries(titles).map(([id,v])=>({id,v})).sort(byVal));
  const money=ent.filter(e=>MONEY_COLS.includes(colOf(e)));
  let h=`<div class="toolbar" style="margin-top:0"><div class="seg full" role="group" aria-label="Zeitraum">${[['saison','Saison 26/27'],['monat',monthName(curMonth())]].map(([k,l])=>`<button data-act="smode" data-k="${k}" aria-pressed="${S.smode===k}">${esc(l)}</button>`).join('')}</div></div>`;
  if(!money.length&&!kfl.length)return h+`<div class="empty">Für diesen Zeitraum gibt es noch keine Strafen.</div>`;
  h+=card('Größte Zahler','Strafen, Fußball und Bier zusammen – der Erste wird im nächsten Monat zum 🐲',bars(rankBy(r=>r.strafen+r.fussball+r.bier),eur));
  h+=card('Meiste Strafen','Nur Spalte „Strafen“',bars(rankBy(r=>r.strafen),eur));
  h+=card('Fußball an der Decke',null,bars(rankBy(r=>r.fussball),eur));
  h+=card('Bier',null,bars(rankBy(r=>r.bier),eur));
  if(kfl.length)h+=card('Kabinenfeste','Wer wie oft eines aufgebrummt bekommen hat',bars(kfl,v=>v+'×'));
  if(mo==='saison'&&tl.length)h+=card('Drachen-Titel','Monate, in denen jemand am meisten gezahlt hat',bars(tl.filter(x=>x.rk<=5),v=>v+'×'));
  return h;
}

const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};

// Runden: Wer zuerst 5 Spiele gewinnt, gewinnt die Runde. Danach geht es wieder bei 0:0 los und das Verlierer-Team bekommt ein Kabinenfest.
function fbRounds(){const asc=fbGames().reverse(),rounds=[];let cur={jung:0,alt:0},games=[];
  for(const x of asc){const w=x.jung>x.alt?'jung':x.alt>x.jung?'alt':null;games.push(x);if(!w)continue;cur[w]++;
    if(cur[w]>=FB_WIN){rounds.push({no:rounds.length+1,winner:w,loser:otherTeam(w),w:cur[w],l:cur[otherTeam(w)],endId:x.id,date:x.date,games});cur={jung:0,alt:0};games=[]}}
  return{rounds,cur,games}}
function fbStats(){const st={tore:{}};
  for(const x of fbGames())for(const t of x.goals||[]){const o=st.tore[t.pid]??={n:0,k:0,games:new Set()};o.n+=t.n||0;o.k+=t.k||0;if((t.n||0)+(t.k||0))o.games.add(x.id)}
  st.ranking=Object.entries(st.tore).map(([pid,o])=>({p:pById(pid),pid,n:o.n,k:o.k,pts:o.n+2*o.k,games:o.games.size})).filter(x=>x.pts>0)

function monthGroups(pid,list){

function deckeUpdate(s){

async function submitDecke(){

async function startZahltag(){
  if(!isKW()){toast('Nur Kassenwart und Admin können den Zahltag starten');return}
  if(zOpen()){toast('Es läuft schon ein Zahltag');return}
  // zuerst Guthaben verrechnen: Einträge, die das Guthaben komplett abdeckt, gelten danach als bezahlt
  let credited=0;try{const {data,error}=await S.sb.rpc('apply_credit_all');if(error)throw error;credited=data||0;await S.db.refresh('entries','bills')}catch(e){toast('Guthaben konnte nicht verrechnet werden: '+(e.message||e));return}
  const now=Date.now(),due={},entryIds=[];
  for(const p of sortedPlayers(true)){const b=balance(p.id),a=toPay(b);if(a>0){due[p.id]=a;for(const e of S.entries)if(e.playerId===p.id&&!e.paid)entryIds.push(e.id)}}
  const z={active:true,runId:'z'+now.toString(36),startedAt:new Date(now).toISOString(),endsAt:new Date(now+7*DAY).toISOString(),due,entryIds,startedBy:S.uid};
  try{await S.db.doc('zahltag/'+z.runId).set(z);toast(`Zahltag gestartet – ${Object.keys(due).length} Personen haben 7 Tage Zeit${credited?` · ${credited} Einträge mit Guthaben verrechnet`:''}`)}catch(e){toast(errMsg(e))}
}
let penBusy=false,penLast=0;
async function checkPenalties(){
  const z=zt();if(!z||z.penaltiesApplied||penBusy||!S.sb||S.status!=='ready'||Date.now()<Date.parse(z.endsAt)||Date.now()-penLast<60000)return;
  penBusy=true;penLast=Date.now();
  try{const {data,error}=await S.sb.rpc('apply_late_fees');if(!error&&data)toast(`Zahltag abgelaufen: ${data}× automatisch ${eur(LATE_FEE)} Zahlungsverzug eingetragen`)}catch(e){}finally{penBusy=false}
}
setInterval(()=>{if(zt()){render();checkPenalties()}},60000);

/* Wer rechtzeitig gemeldet hat und dessen Zahlung bestätigt wird, bekommt die Verzugsstrafe erlassen */
async function liftPenalty(pid,justPaid){
  let n=0;
  for(const pe of S.entries.filter(e=>e.auto&&e.playerId===pid&&!e.paid&&/^verzug-/.test(e.id))){
    const z=S.zahltags.find(x=>x.runId===pe.id.split('-')[1]);if(!z)continue;
    const ids=new Set(z.entryIds||[]);
    const inTime=S.entries.filter(e=>ids.has(e.id)&&e.playerId===pid).every(e=>justPaid.has(e.id)?(!!e.reportedAt&&Date.parse(e.reportedAt)<=Date.parse(z.endsAt)):!!e.paid);
    if(inTime){await S.db.doc('entries/'+pe.id).delete();n++}
  }
  return n;
}
